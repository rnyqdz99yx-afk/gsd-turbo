name: CI

on:
  # branches only: a release tag points at a commit that main has already tested
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# a newer push to a work branch replaces its run; main's runs are never cancelled
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}${{ matrix.shard && format(' / part {0}', matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          # the slow legs run as parts side by side (node --test --test-shard splits the test files, each file still
          # runs whole): Windows took 14 minutes in one piece, macOS 8
          - os: windows-latest
            node: 24
            shard: 1/3
          - os: windows-latest
            node: 24
            shard: 2/3
          - os: windows-latest
            node: 24
            shard: 3/3
          # the first friends run turbo on a Mac: its own temp-directory links, file system and process tools
          - os: macos-latest
            node: 22
            shard: 1/2
          - os: macos-latest
            node: 22
            shard: 2/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - if: ${{ !matrix.shard }}
        run: npm test
      - if: ${{ matrix.shard }}
        run: node --test --test-shard=${{ matrix.shard }}
